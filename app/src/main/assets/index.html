<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TAT SMART</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="tat-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TAT SMART"><meta name="theme-color" content="#0a101c">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* Layout: installer workbench. Floor plan on drafting paper takes the stage, a narrow tool rail beside it (stacks under it on phones). */
:root{
  --paper:#eef1f4; --sheet:#ffffff; --ink:#18232f; --muted:#5d6b7a; --line:#d3dae2;
  --accent:#1f5fbf; --accent-ink:#ffffff; --lit:#f2a516; --lit-glow:rgba(242,165,22,.35);
  --cool:#2a9d8f; --danger:#c2412d; --chip:#e3e9f0;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f151c; --sheet:#17202a; --ink:#e6ecf2; --muted:#93a3b4; --line:#2a3644;
  --accent:#5b9bff; --accent-ink:#0b1420; --lit:#ffbf3c; --lit-glow:rgba(255,191,60,.3);
  --cool:#4cc2b2; --danger:#ff7a63; --chip:#223040; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f151c; --sheet:#17202a; --ink:#e6ecf2; --muted:#93a3b4; --line:#2a3644;
  --accent:#5b9bff; --accent-ink:#0b1420; --lit:#ffbf3c; --lit-glow:rgba(255,191,60,.3);
  --cool:#4cc2b2; --danger:#ff7a63; --chip:#223040; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl}
.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px;max-width:1400px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;font-size:.92em}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.25rem;font-weight:700;letter-spacing:.2px}
.brand .tag.ok{background:color-mix(in srgb,var(--cool) 22%,var(--sheet));color:var(--ink)}
.brand .tag.bad{background:color-mix(in srgb,var(--danger) 18%,var(--sheet));color:var(--danger)}
.brand .tag{font-size:.75rem;color:var(--muted);background:var(--chip);padding:2px 8px;border-radius:99px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.select{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;max-width:220px}
.btn{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:7px 12px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.armed{background:var(--danger);color:#fff}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}

/* workbench */
.bench{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:900px){.bench{grid-template-columns:minmax(0,1fr)}}
.stagewrap{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint b{color:var(--ink);font-weight:600}
.stage{position:relative;direction:ltr;width:100%;border-radius:6px;overflow:hidden;
  background-color:var(--paper);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:24px 24px;touch-action:none;user-select:none;-webkit-user-select:none}
.stage img{display:block;width:100%;height:auto;pointer-events:none}
.stage.editing{cursor:crosshair}
.empty{padding:60px 20px;text-align:center;color:var(--muted);direction:rtl}

/* device markers */
.dev{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;background:var(--sheet);border:2px solid var(--ink);color:var(--ink);
  box-shadow:0 2px 6px rgba(0,0,0,.18);transition:background .15s,box-shadow .2s,border-color .15s;padding:0}
.dev svg{width:24px;height:24px}
.dev.on{background:var(--lit);border-color:var(--lit);color:#2a1a00;box-shadow:0 0 0 8px var(--lit-glow),0 2px 6px rgba(0,0,0,.2)}
.dev.hvac.on{background:var(--cool);border-color:var(--cool);color:#fff;box-shadow:0 0 0 8px color-mix(in srgb,var(--cool) 30%,transparent)}
.dev .lvl{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;background:var(--ink);color:var(--sheet);padding:0 5px;border-radius:4px;white-space:nowrap}
.dev .nm{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;background:color-mix(in srgb,var(--sheet) 88%,transparent);padding:0 5px;border-radius:4px;direction:rtl;font-family:var(--f-body)}
@media (max-width:600px){.dev{width:34px;height:34px}.dev svg{width:18px;height:18px}.dev .nm{display:none}.dev .lvl{bottom:-17px;font-size:10px}.dev.on{box-shadow:0 0 0 5px var(--lit-glow)}}
[hidden]{display:none!important}
.editing .dev{border-style:dashed;cursor:grab}
.dev.dragging{cursor:grabbing;opacity:.85}
.dev.unbound::after{content:"";position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:var(--danger);border:2px solid var(--sheet)}
.viewbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.v3d{position:relative;width:100%;height:min(74vh,700px);background:#0b1220;direction:rtl}
.v3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.v3dmsg{position:absolute;inset:0;display:grid;place-items:center;color:#cbd5e1}
.v3dbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.v3dbar .btn{background:rgba(15,23,42,.78);color:#fff;border-color:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.v3s{display:flex;align-items:center;gap:6px;background:rgba(15,23,42,.78);color:#fff;border-radius:8px;padding:4px 10px;font-size:.8rem}
.v3s input{width:110px}
.roomh{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 6px;font-weight:600;color:var(--ink)}
.roomh .btn{padding:3px 10px;font-size:.78rem}

/* side rail */
.rail{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:11px 6px;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:12px;display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto}
.row{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);text-align:start;width:100%}
.row:hover{border-color:var(--accent)}
.row .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--chip);flex:none}
.row .ic svg{width:17px;height:17px}
.row .tx{min-width:0;flex:1}
.row .tx div:first-child{font-weight:600}
.row .tx div:last-child{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--lit);color:#2a1a00}
.galist{display:flex;flex-direction:column}
.ga{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:.86rem;align-items:center}
.ga .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.import{border:1.5px dashed var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:.86rem;color:var(--muted)}
.log{font-family:var(--f-mono);font-size:12px;direction:ltr;display:flex;flex-direction:column;gap:2px}
.log div{padding:3px 6px;border-radius:4px;background:var(--paper);display:flex;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .t{color:var(--muted)}
.log .rx{color:var(--cool)}
.muted{color:var(--muted);font-size:.86rem}
.search{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.45);display:grid;place-items:center;z-index:50;padding:16px}
.sheet{background:var(--sheet);border-radius:14px;width:min(460px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
@media (max-width:560px){.scrim{place-items:end center;padding:0}.sheet{border-radius:16px 16px 0 0;width:100%;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h2{font-size:1.1rem}
.x{border:0;background:var(--chip);width:32px;height:32px;border-radius:50%;flex:none}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.82rem;color:var(--muted)}
.field input,.field select{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.field input.mono{text-align:left}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px}
.dev.tuya.on{background:var(--lit);border-color:var(--lit)}
.dev.offline{opacity:.45;filter:grayscale(1)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.swatches button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swatches button.white{background:linear-gradient(135deg,#ffd8a0,#fff,#cfe3ff);width:auto;border-radius:18px;padding:0 12px;font-size:.8rem;color:#333}
.ct{background:linear-gradient(90deg,#ffb35c,#fff4e0,#cfe3ff);height:10px;border-radius:5px;margin-bottom:4px}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0;text-align:center}
.meter div{background:var(--chip);border-radius:10px;padding:8px 4px}.meter b{display:block;font-family:var(--f-mono);font-size:1.05rem;color:var(--ink)}
.sch{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.sch .tm{font-family:var(--f-mono);font-size:1.3rem;color:var(--ink)}.sch .tx{flex:1;font-size:.82rem;color:var(--muted)}
.days{display:flex;gap:4px;flex-wrap:wrap}.days label{display:flex;align-items:center;gap:2px;font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.devpick label.scrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line)}
.devpick label.scrow:last-child{border-bottom:0}.devpick label.scrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.devpick label.scrow select{width:auto;padding:5px 8px}.devpick label.scrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.devpick{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px}.devpick label{display:flex;gap:6px;align-items:center;padding:3px 0;font-size:.85rem}
#allOff.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
select{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.types button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem}
.types button svg{width:20px;height:20px}
.types button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--sheet));color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.big{display:flex;gap:10px}
.big button{flex:1;padding:16px 8px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:1rem}
.big button.active{background:var(--lit);border-color:var(--lit);color:#2a1a00}
.slider{display:flex;flex-direction:column;gap:6px}
.slider .v{font-family:var(--f-display);font-size:2rem;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:99px;font-size:.88rem;z-index:60;max-width:calc(100% - 32px)}
.note{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
/* ---------- dashboard (owner view) ---------- */
#dash{--d-bg:#0a101c;--d-card:#111a2b;--d-card2:#162236;--d-line:rgba(130,165,225,.14);--d-ink:#eaf0f8;--d-mut:#93a1b8;--d-acc:#6c9ce6;--d-acc2:#446592;--d-warm:#ffc070;
 position:fixed;inset:0;z-index:20;background:radial-gradient(1200px 600px at 80% -10%,#1b2c4a 0%,transparent 60%),var(--d-bg);color:var(--d-ink);display:grid;grid-template-columns:210px 1fr;font-family:var(--f-body,system-ui)}
#dash[hidden]{display:none}
.dside{border-inline-start:0;border-inline-end:1px solid var(--d-line);padding:18px 12px;display:flex;flex-direction:column;gap:6px;background:rgba(5,9,18,.45)}
.dbrand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem;margin:2px 6px 18px;color:var(--d-ink)}
.dbrand svg{width:26px;height:26px;color:var(--d-acc)}
.dnav{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:none;color:var(--d-mut);padding:10px 12px;border-radius:12px;font:inherit;font-size:.92rem;cursor:pointer;text-align:start}
.dnav svg{width:20px;height:20px;flex:none}
.dnav:hover{color:var(--d-ink)}
.dnav[aria-current="true"]{background:linear-gradient(135deg,rgba(108,156,230,.28),rgba(68,101,146,.18));border-color:rgba(108,156,230,.45);color:#fff}
.dside .sp{flex:1}
.dmain{overflow:auto;padding:22px 24px 28px;min-width:0}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.dhead h1{margin:0;font-family:var(--f-display,inherit);font-size:1.7rem;font-weight:700;border-inline-start:3px solid var(--d-acc);padding-inline-start:12px;line-height:1.1}
.dhead .sub{color:var(--d-mut);font-size:.85rem;margin-top:6px;padding-inline-start:15px}
.dchips{display:flex;gap:8px;flex-wrap:wrap}
.dchip{background:var(--d-card);border:1px solid var(--d-line);border-radius:99px;padding:6px 12px;font-size:.8rem;color:var(--d-mut)}
.dchip b{color:var(--d-ink)}
.dgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.azones{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.azone .arow1{display:flex;align-items:center;gap:12px}
.azone .aart{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--d-card2);color:var(--d-acc);flex:none}
.azone .aart svg{width:24px;height:24px}
.azone.playing .aart{background:linear-gradient(135deg,#a98bf0,#446592);color:#fff}
.azone .atitle{font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.azone .arow2{display:flex;gap:8px;margin:12px 0 8px;flex-wrap:wrap}
.azone .aplay{flex:1}
.azone .avol{display:flex;align-items:center;gap:10px;color:var(--d-mut);font-size:.85rem}
.azone .avol input{flex:1;accent-color:#a98bf0;min-width:0}
.azone .asrc{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.lib .ltop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rsearch{display:flex;gap:8px}.rsearch input{flex:1;min-width:0}
.rlogo{width:32px;height:32px;border-radius:8px;object-fit:cover;flex:none;background:#fff}
.sphow{padding:12px;border-radius:14px;background:rgba(30,215,96,.08);border:1px solid rgba(30,215,96,.3)}.sphow ol{margin:6px 0;padding-inline-start:20px}
.slist{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:420px;overflow:auto}
.srow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--d-line)}
.srow .sname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.splay{width:36px;height:36px;border-radius:50%;border:0;background:#a98bf0;color:#14092e;font-size:14px;cursor:pointer;flex:none}
.pgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.aeq{display:flex;align-items:flex-end;gap:3px;height:20px}
.aeq i{width:3px;height:25%;border-radius:2px;background:#a98bf0}
.aeq.on i{animation:aeq 1s ease-in-out infinite}.aeq.on i:nth-child(2){animation-delay:.15s}.aeq.on i:nth-child(3){animation-delay:.3s}.aeq.on i:nth-child(4){animation-delay:.45s}
@keyframes aeq{0%,100%{height:25%}50%{height:100%}}
@media (prefers-reduced-motion:reduce){.aeq.on i{animation:none}}
.dcard{position:relative;background:linear-gradient(160deg,var(--d-card2),var(--d-card));border:1px solid var(--d-line);border-radius:18px;padding:14px;overflow:hidden;min-height:150px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.dcard h3{margin:0 0 8px;font-size:.92rem;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--d-ink)}
.dcard h3 svg{width:17px;height:17px;color:var(--d-acc)}
.dcard .more{position:absolute;top:12px;inset-inline-end:12px;font-size:.75rem;color:var(--d-mut);background:none;border:0;cursor:pointer}
.dhero{grid-column:span 7;min-height:260px;padding:0;cursor:pointer;background:#0d1524}
.dhero img,.droom img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dhero .ov,.droom .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,9,18,.85) 0%,rgba(5,9,18,.1) 55%,rgba(5,9,18,.35) 100%)}
.dhero .tag2,.droom .tag2{position:absolute;top:12px;inset-inline-end:12px;background:rgba(5,9,18,.7);border:1px solid var(--d-line);border-radius:99px;padding:4px 12px;font-size:.8rem}
.dhero .cap,.droom .cap{position:absolute;bottom:14px;inset-inline-start:16px;inset-inline-end:16px}
.cap .t{font-size:1.25rem;font-weight:700}.cap .s{color:#d3deee;font-size:.85rem}
.dac{grid-column:span 5}

/* ---------- Tuya ---------- */
let tuyaSt={},tuyaList=null;
const DIM_RANGE={bright_value_v2:[10,1000],bright_value:[25,255],bright_value_1:[10,1000],bright_value_2:[10,1000],bright_value_3:[10,1000]};
function tuyaPct(d,v){const a=d.dimMin??10,b=d.dimMax??1000;return Math.max(0,Math.min(100,Math.round((v-a)*100/(b-a))));}
function tuyaRaw(d,pct){const a=d.dimMin??10,b=d.dimMax??1000;return Math.round(a+(b-a)*pct/100);}
function tuyaFeat(d){
 const st=(tuyaSt[d.tuyaId]||{}).status||{};
 const f={st};
 f.temp=["temp_value_v2","temp_value"].find(k=>typeof st[k]==="number");f.tempMax=f.temp==="temp_value"?255:1000;
 f.colour=["colour_data_v2","colour_data"].find(k=>k in st);f.cMax=f.colour==="colour_data"?255:1000;
 f.mode="work_mode" in st;
 if(typeof st.cur_power==="number"){f.power=st.cur_power/10;f.volt=typeof st.cur_voltage==="number"?st.cur_voltage/10:null;f.amp=typeof st.cur_current==="number"?st.cur_current/1000:null;}
 return f;
}
function tuyaColour(f){let c=f.st[f.colour];if(typeof c==="string"){try{c=JSON.parse(c);}catch(e){c=null;}}return c&&typeof c==="object"?c:null;}
function tuyaTint(d){
 if(d.type!=="tuya"||!d.st.on)return "";const f=tuyaFeat(d);
 if(f.colour&&f.st.work_mode==="colour"){const c=tuyaColour(f);if(c)return `background:hsl(${c.h},90%,60%);border-color:hsl(${c.h},90%,50%);box-shadow:0 0 0 8px hsla(${c.h},90%,60%,.35)`;}
 if(f.temp){const k=f.st[f.temp]/f.tempMax;return `background:hsl(${36-k*(36-210)},${90-k*40}%,${62+k*18}%)`;}
 return "";
}
function tuyaApply(){
 db.projects.forEach(p=>p.devices.forEach(d=>{
  if(d.type!=="tuya"||!d.tuyaId)return;const t=tuyaSt[d.tuyaId];if(!t)return;
  d.st.offline=!t.online;if(d.code&&d.code in t.status)d.st.on=!!t.status[d.code];
  if(d.dimCode&&typeof t.status[d.dimCode]==="number")d.st.level=tuyaPct(d,t.status[d.dimCode]);
 }));
}
function tuyaSend(d,code,value){
 if(!d.tuyaId){toast("هذا الجهاز ما مربوط بجهاز تويا، اربطه من وضع التعديل");return false;}
 if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:"tuya",id:d.tuyaId,code,value}));
 const t=new Date().toLocaleTimeString("en-GB");log.unshift({t,addr:"Tuya "+(d.tuyaName||d.name),val:code+" = "+value});if(log.length>200)log.pop();
 return true;
}
async function loadTuya(force){
 if(tuyaList&&!force)return tuyaList;
 const r=await fetch("api/tuya/devices").then(r=>r.json()).catch(()=>({ok:false,error:"ما كدرت أوصل لبرنامج الربط"}));
 if(!r.ok)throw new Error(r.error||"Tuya");
 tuyaList=r.devices;r.devices.forEach(x=>tuyaSt[x.id]=x);return tuyaList;
}

 if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>5)drag.moved=true;
 if(!drag.moved)return;
 drag.el.classList.add("dragging");
 const x=Math.min(98,Math.max(2,(e.clientX-drag.rect.left)/drag.rect.width*100));
 const y=Math.min(97,Math.max(3,(e.clientY-drag.rect.top)/drag.rect.height*100));
 drag.el.style.left=x+"%";drag.el.style.top=y+"%";drag.x=x;drag.y=y;
});
$("#stage").addEventListener("pointerup",()=>{
 if(!drag)return;const d=P().devices.find(x=>x.id===drag.id);
 if(drag.moved&&mode==="edit"){d.x=+drag.x.toFixed(2);d.y=+drag.y.toFixed(2);save();drag.el.classList.remove("dragging");}
 else if(d){mode==="edit"?editDevice(d):operate(d);}
 drag=null;
});
$("#stage").addEventListener("pointercancel",()=>{drag=null;});
$("#pane").addEventListener("click",e=>{
 const ro=e.target.closest("[data-roomoff]");
 if(ro){const room=ro.dataset.roomoff;P().devices.filter(d=>(d.room||"")===room&&d.st.on).forEach(d=>{
   if(d.type==="tuya"){tuyaSend(d,d.code,false);d.st.on=false;}
   else if(["switch","dimmer","hvac"].includes(d.type)&&d.ga&&d.ga.cmd){telegram(d.ga.cmd,"1.001",0);d.st.on=false;respond(d.ga.status,"1.001",0);}});
  refresh();toast("انطفت "+(room||"الأجهزة"));return;}
 const r=e.target.closest("[data-dev]");if(!r)return;const d=P().devices.find(x=>x.id===r.dataset.dev);
 mode==="edit"?editDevice(d):operate(d);
});

function loadThree(){return new Promise((res,rej)=>{if(window.THREE&&THREE.OrbitControls)return res();const s=document.createElement("script");s.src="three.js";s.onload=res;s.onerror=()=>rej(new Error("three"));document.head.appendChild(s);});}
function findWalls(img,thr){
 const W=Math.min(1400,img.naturalWidth),Hh=Math.round(img.naturalHeight*W/img.naturalWidth);
 const c=document.createElement("canvas");c.width=W;c.height=Hh;const x=c.getContext("2d");x.drawImage(img,0,0,W,Hh);
 const px=x.getImageData(0,0,W,Hh).data;const N=Math.max(60,Math.min(260,Math.round(W/6)));const cs=W/N;const M=Math.ceil(Hh/cs);
 const g=new Uint8Array(N*M);const lum=100+thr*1.2;
 for(let j=0;j<M;j++)for(let i=0;i<N;i++){let dark=0,tot=0;
  const x0=Math.floor(i*cs),x1=Math.min(W,Math.floor((i+1)*cs)),y0=Math.floor(j*cs),y1=Math.min(Hh,Math.floor((j+1)*cs));
  for(let y=y0;y<y1;y+=1)for(let xx=x0;xx<x1;xx+=1){const k=(y*W+xx)*4,r=px[k],gg=px[k+1],b=px[k+2];tot++;
   if(px[k+3]>100&&(r+gg+b)/3<lum&&Math.max(r,gg,b)-Math.min(r,gg,b)<70)dark++;}
  if(tot&&dark/tot>0.42)g[j*N+i]=1;}
 // drop small blobs (text, symbols)
 const seen=new Int32Array(N*M).fill(-1),minSize=Math.max(8,Math.round(N/14));
 for(let s=0;s<N*M;s++){if(!g[s]||seen[s]>=0)continue;const q=[s],comp=[s];seen[s]=s;
  while(q.length){const v=q.pop(),i=v%N,j=(v/N)|0;for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=i+di,b=j+dj;if(a<0||b<0||a>=N||b>=M)continue;const u=b*N+a;if(g[u]&&seen[u]<0){seen[u]=s;q.push(u);comp.push(u);}}}
  if(comp.length<minSize)comp.forEach(u=>g[u]=0);}
 // greedy rectangles
 const used=new Uint8Array(N*M),rects=[];
 for(let j=0;j<M;j++)for(let i=0;i<N;i++){const s=j*N+i;if(!g[s]||used[s])continue;
  let w=1;while(i+w<N&&g[s+w]&&!used[s+w])w++;
  let h=1;outer:while(j+h<M){for(let k=0;k<w;k++){const u=(j+h)*N+i+k;if(!g[u]||used[u])break outer;}h++;}
  for(let b=0;b<h;b++)for(let k=0;k<w;k++)used[(j+b)*N+i+k]=1;rects.push([i,j,w,h]);}
 return {rects,N,M};
}

const GLYPH={switch:"💡",dimmer:"🔆",blind:"▤",hvac:"❄",scene:"★",tuya:"💡"};
function devColor(d){
 if(d.type==="hvac")return d.st.on?"#3b82f6":null;
 if(d.type==="blind")return null;
 if(!d.st.on||d.type==="scene")return null;
 if(d.type==="tuya"){const f=tuyaFeat(d);if(f.colour&&f.st.work_mode==="colour"){const c=tuyaColour(f);if(c)return `hsl(${c.h},95%,60%)`;}
  if(f.temp){const k=f.st[f.temp]/f.tempMax;return `hsl(${36-k*(36-210)},${95-k*45}%,${62+k*20}%)`;}}

}
function iconTex(d){

 const col=devColor(d);x.beginPath();x.arc(128,64,52,0,7);x.fillStyle=col||"rgba(30,41,59,.92)";x.fill();
 x.lineWidth=6;x.strokeStyle=col?"#fff":"rgba(255,255,255,.75)";x.stroke();
 x.font="56px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillStyle=col?"#2a1a00":"#fff";x.fillText(GLYPH[d.type]||"•",128,68);
 let sub="";if(d.type==="dimmer"&&d.st.on)sub=(d.st.level||0)+"%";if(d.type==="blind")sub=(d.st.pos||0)+"%";if(d.type==="hvac")sub=d.st.on?d.st.setpoint+"°":(d.st.temp!=null?d.st.temp+"°":"");
 if(d.type==="tuya"&&d.st.on){const pw=tuyaFeat(d).power;sub=pw!=null?Math.round(pw)+"W":d.dimCode?(d.st.level||0)+"%":"";}
 x.font="bold 30px sans-serif";const label=d.name+(sub?" · "+sub:"");const tw=Math.min(250,x.measureText(label).width+24);
 x.fillStyle="rgba(15,23,42,.82)";x.beginPath();x.roundRect?x.roundRect(128-tw/2,128,tw,44,12):x.rect(128-tw/2,128,tw,44);x.fill();
 x.fillStyle="#fff";x.direction="rtl";x.fillText(label,128,151,240);

 if(d.type==="dimmer"){if(!telegram(g.value,"5.001",n))return;d.st.level=n;d.st.on=n>0;respond(g.valueStatus,"5.001",n);return;}
 if(d.type==="tuya"&&d.dimCode){const cmds=[{code:d.code,value:n>0}];if(n>0)cmds.push({code:d.dimCode,value:tuyaRaw(d,n)});
  if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:"tuya",id:d.tuyaId,commands:cmds}));d.st.level=n;d.st.on=n>0;return;}
 if(d.type==="blind"){if(telegram(g.position,"5.001",n))d.st.pos=n;return;}
}

async function uploadSongs(files){if(!files||!files.length)return;files=[...files];let added=0;const CH=1536*1024;
 for(let k=0;k<files.length;k++){const f=files[k];const n=Math.max(1,Math.ceil(f.size/CH));const up=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  try{for(let i=0;i<n;i++){upProg=`⬆ ${k+1}/${files.length} · ${f.name.slice(0,30)} · ${Math.round(i*100/n)}%`;renderUp();let r,tries=0;
    while(true){try{r=await (await fetch(`api/music/part?up=${up}&i=${i}&n=${n}&name=${encodeURIComponent(f.name)}`,{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:f.slice(i*CH,(i+1)*CH)})).json();break;}catch(e){if(++tries>3)throw "انقطع النت";await new Promise(z=>setTimeout(z,1500*tries));}}
    if(!r.ok)throw r.error;if(r.songs){music.songs=r.songs;added++;}}}
  catch(e){toast(f.name+": "+(typeof e==="string"?e:"ما انرفعت"));}}
 upProg="";toast("انضافت "+added+" أغنية");renderDash();}

  const n=prompt("اسم البيت الجديد",(j.name||"بيت")+" (نسخة)");if(!n)return;const p={id:uid(),name:n,plan:null,planW:0,planH:0,gas:j.gas||[],devices:j.devices,scenes:j.scenes||[],solarRules:j.solarRules||{},rooms:j.rooms||{}};
  db.projects.push(p);db.current=p.id;save();renderDash();render();toast("انستورد القالب، عدّل العناوين من الصيانة");});return;}

 if(t.dataset.logo&&t.files[0]){const f=t.files[0];const url=URL.createObjectURL(f);const img=new Image();img.onload=()=>{const k=Math.min(1,300/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);const p=P();p.brand=Object.assign({},p.brand,{logo:c.toDataURL("image/png")});save();renderDash();toast("انرفع الشعار");};img.src=url;return;}
 if(t.dataset.lv){const d=P().devices.find(x=>x.id===t.dataset.lv);if(d.type==="dimmer"&&+t.value>0&&!d.st.on)devSet(d,true);devLevel(d,+t.value);refresh();t.blur();renderDash();}

/* ---------- schedules (run by the bridge, also when no page is open) ---------- */
let schedules=null,holiday={enabled:false,devices:[]},sunT={};
const DAYS=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
const schedulable=d=>["switch","dimmer","tuya","hvac","blind","scene"].includes(d.type);
async function loadSchedules(){try{const r=await fetch("api/schedules");const j=r.ok?await r.json():{};schedules=j.schedules||[];holiday=Object.assign({enabled:false,devices:[]},j.holiday||{});sunT=j.sun||{};}catch(e){schedules=[];}}
function whenText(s){const off=+s.offset||0,o=off?(off>0?" + ":" − ")+Math.abs(off)+" د":"";
 if(s.at==="sunset")return "🌇 الغروب"+o+(sunT.sunset?` (${sunT.sunset})`:"");if(s.at==="sunrise")return "🌅 الشروق"+o+(sunT.sunrise?` (${sunT.sunrise})`:"");return s.time;}
function saveSchedules(){fetch("api/schedules",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({schedules,holiday})}).then(r=>{if(!r.ok)throw 0;}).catch(()=>toast("ما انحفظت المواعيد، تأكد إن الجسر شغّال"));}
function actLabel(s){const ds=(s.devices||[]).map(id=>P().devices.find(x=>x.id===id)).filter(Boolean);
 const allScene=ds.length&&ds.every(x=>x.type==="scene");return allScene?"تشغيل":s.on?"تشغيل":"إطفاء";}
function renderSchedules(pane){
 if(schedules===null){pane.innerHTML=`<p class="muted">جاري التحميل…</p>`;loadSchedules().then(()=>{if(tab==="sch")renderPane();});return;}
 const p=P();
 pane.innerHTML=`<p class="muted">المواعيد تشتغل من التابليت بالبيت، حتى لو كل التلفونات مسدودة.</p>`+
  (schedules.length?schedules.map((s,i)=>{const names=(s.devices||[]).map(id=>(p.devices.find(x=>x.id===id)||{}).name).filter(Boolean);
   const days=(s.days&&s.days.length&&s.days.length<7)?s.days.map(x=>DAYS[x]).join("، "):"كل يوم";
   return `<div class="sch"><span class="tm" style="${s.at&&s.at!=="time"?"font-size:.9rem":""}">${esc(whenText(s))}</span><span class="tx"><b style="color:var(--ink)">${esc(s.name||actLabel(s))}</b><br>${actLabel(s)}: ${esc(names.join("، ")||"—")}<br>${days}</span>
   <label title="مفعّل"><input type="checkbox" data-en="${i}" ${s.enabled!==false?"checked":""}></label><button class="btn" data-ed="${i}">تعديل</button></div>`;}).join(""):`<p class="muted">ما بيه مواعيد بعد.</p>`)+
  `<button class="btn primary" id="addSch">+ موعد جديد</button>`+
  `<div class="sch" style="margin-top:14px;flex-wrap:wrap"><span class="tx"><b style="color:var(--ink)">✈️ وضع السفر</b><br>لمن تكونون برة البيت، الإنارة المختارة تشتغل وتنطفي بشكل عشوائي من الغروب لحد نص الليل، كأنه أكو ناس بالبيت.</span>
   <label><input type="checkbox" id="holEn" ${holiday.enabled?"checked":""}> مفعّل</label><button class="btn" id="holEd">اختيار الإنارة (${holiday.devices.length})</button></div>`;
 pane.querySelectorAll("[data-en]").forEach(c=>c.onchange=()=>{schedules[+c.dataset.en].enabled=c.checked;saveSchedules();});
 pane.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>editSchedule(+b.dataset.ed));
 $("#addSch").onclick=()=>editSchedule(-1);
 $("#holEn").onchange=()=>{if($("#holEn").checked&&!holiday.devices.length){$("#holEn").checked=false;toast("اختار الإنارة أول");return;}holiday.enabled=$("#holEn").checked;saveSchedules();toast(holiday.enabled?"وضع السفر شغّال":"انطفى وضع السفر");};
 $("#holEd").onclick=()=>{const devs=P().devices.filter(d=>["switch","dimmer","tuya"].includes(d.type));
  sheet(`<header><h2>إنارة وضع السفر</h2><button class="x" data-close aria-label="إغلاق">✕</button></header>
   <div class="devpick" style="max-height:50vh">${devs.map(d=>`<label><input type="checkbox" data-hv="${d.id}" ${holiday.devices.includes(d.id)?"checked":""}>${esc(d.name)} <span class="muted">${esc(d.room||"")}</span></label>`).join("")}</div>
   <div class="actions"><span></span><button class="btn primary" id="holOk">حفظ</button></div>`,()=>{
   $("#holOk").onclick=()=>{holiday.devices=[...document.querySelectorAll("[data-hv]:checked")].map(c=>c.dataset.hv);if(!holiday.devices.length)holiday.enabled=false;saveSchedules();close();renderPane();};});};
}
function editSchedule(i){
 const s=i>=0?JSON.parse(JSON.stringify(schedules[i])):{id:uid(),name:"",time:"19:00",on:true,days:[0,1,2,3,4,5,6],devices:[],enabled:true};
 const devs=P().devices.filter(schedulable);
 sheet(`<header><h2>${i>=0?"تعديل الموعد":"موعد جديد"}</h2><button class="x" data-close aria-label="إغلاق">✕</button></header>
  <div class="grid2"><div class="field"><label for="sName">الاسم (اختياري)</label><input id="sName" value="${esc(s.name)}" placeholder="مثلاً: إنارة المسا"></div>
  <div class="field"><label for="sAt">متى</label><select id="sAt"><option value="time">بوقت محدد</option><option value="sunset" ${s.at==="sunset"?"selected":""}>🌇 وقت الغروب${sunT.sunset?" (اليوم "+sunT.sunset+")":""}</option><option value="sunrise" ${s.at==="sunrise"?"selected":""}>🌅 وقت الشروق${sunT.sunrise?" (اليوم "+sunT.sunrise+")":""}</option></select></div></div>
  <div class="grid2"><div class="field" id="fTime"><label for="sTime">الوقت</label><input id="sTime" type="time" value="${esc(s.time)}"></div>
  <div class="field" id="fOff"><label for="sOffs">قبل/بعد (دقايق)</label><input id="sOffs" type="number" step="5" value="${+s.offset||0}" placeholder="مثلاً -15 يعني قبل ربع ساعة"></div></div>
  <div class="field"><label>شنو يسوي</label><div class="big"><button id="sOn" class="${s.on?"active":""}">تشغيل</button><button id="sOff" class="${!s.on?"active":""}">إطفاء</button></div></div>
  <div class="field"><label>الأيام</label><div class="days">${DAYS.map((n,k)=>`<label><input type="checkbox" data-day="${k}" ${s.days.includes(k)?"checked":""}>${n}</label>`).join("")}</div></div>
  <div class="field"><label>الأجهزة</label><div class="devpick">${devs.map(d=>`<label><input type="checkbox" data-dv="${d.id}" ${s.devices.includes(d.id)?"checked":""}>${esc(d.name)} <span class="muted">· ${TYPES[d.type].label}</span></label>`).join("")||"<span class='muted'>ما بيه أجهزة</span>"}</div></div>
  <p class="note">الستارة: تشغيل = تنزل، إطفاء = تصعد. السين يشتغل بس ويا "تشغيل".</p>
  <div class="actions">${i>=0?`<button class="btn danger" id="sDel">حذف</button>`:"<span></span>"}<div style="display:flex;gap:8px"><button class="btn" data-close>إلغاء</button><button class="btn primary" id="sOk">حفظ</button></div></div>`,()=>{
  const atSync=()=>{const a=$("#sAt").value;$("#fTime").hidden=a!=="time";$("#fOff").hidden=a==="time";};$("#sAt").onchange=atSync;atSync();

/* ---------- ETS import ---------- */
async function importEts(file){
 const msg=$("#etsMsg");msg.textContent="جاري القراءة…";
 let gas=[],encrypted=false;
 try{
  if(/\.(csv|txt)$/i.test(file.name)){gas=parseCsv(await file.text());}
  else if(/\.xml$/i.test(file.name)){const doc=new DOMParser().parseFromString(await file.text(),"application/xml");
   for(const el of doc.getElementsByTagName("GroupAddress")){let a=el.getAttribute("Address");if(a==null)continue;a=/\//.test(a)?a:intToGa(a);
    gas.push({addr:a,name:el.getAttribute("Name")||"",dpt:dptFrom(el.getAttribute("DatapointType")||el.getAttribute("DPTs"))});}}
  else{
   if(!window.JSZip)throw new Error("zip");
   const scan=async zip=>{
    for(const name of Object.keys(zip.files)){
     const f=zip.files[name];if(f.dir)continue;
     if(/\.zip$/i.test(name)){try{const inner=await JSZip.loadAsync(await f.async("arraybuffer"));await scan(inner);}catch(e){encrypted=true;}}
     else if(/(^|\/)\d+\.xml$/i.test(name)&&/P-/i.test(name)){
      let txt;try{txt=await f.async("string");}catch(e){encrypted=true;continue;}
      const doc=new DOMParser().parseFromString(txt,"application/xml");
      for(const el of doc.getElementsByTagName("GroupAddress")){
       let a=el.getAttribute("Address");if(a==null)continue;a=/\//.test(a)?a:intToGa(a);
       gas.push({addr:a,name:el.getAttribute("Name")||"",dpt:dptFrom(el.getAttribute("DatapointType"))});
      }
     }
    }
   };
   await scan(await JSZip.loadAsync(file));
  }
 }catch(e){msg.innerHTML=`<span style="color:var(--danger)">ما كدرت أقرأ الملف.</span>`;return;}
 if(!gas.length){
  msg.innerHTML=`<span style="color:var(--danger)">${encrypted?"ملف المشروع محمي بباسورد. من ETS افتح Group Addresses ← Export وصدّرها CSV وارفعها هنا.":"ما لكيت عناوين بالملف."}</span>`;return;
 }
 const seen=new Map();gas.forEach(g=>seen.set(g.addr,g));
 const p=P();const before=p.gas.length;
 if(p.sample){p.gas=[];}
 p.gas.forEach(g=>{if(!seen.has(g.addr))seen.set(g.addr,g);});
 p.gas=[...seen.values()].sort((a,b)=>{const x=a.addr.split("/").map(Number),y=b.addr.split("/").map(Number);return x[0]-y[0]||x[1]-y[1]||x[2]-y[2];});
 save();renderPane();
 $("#etsMsg").innerHTML=`<span style="color:var(--cool)">انضافت ${gas.length} عنوان من ${esc(file.name)}</span>`;
}
function parseCsv(t){
 const lines=t.replace(/^﻿/,"").split(/\r?\n/).filter(Boolean);if(!lines.length)return[];
 const d=[";","\t",","].sort((a,b)=>lines[0].split(b).length-lines[0].split(a).length)[0];
 const out=[];
 for(const ln of lines){
  const cells=ln.split(d).map(c=>c.trim().replace(/^"|"$/g,"").replace(/""/g,'"'));
  const ai=cells.findIndex(c=>/^\d+\/\d+\/\d+$/.test(c));if(ai<0)continue;
  const name=cells.slice(0,ai).reverse().find(c=>c&&c!=="-")||cells.slice(ai+1).find(c=>c&&!/^DPS?T/i.test(c)&&!/^\d/.test(c))||"";
  const dc=cells.find(c=>/^DPS?T-/i.test(c));
  out.push({addr:cells[ai],name,dpt:dptFrom(dc)});
 }
 return out;
}

 return `<div><div class="clk">${now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</div><div class="dt">${now.toLocaleDateString("ar-IQ",{weekday:"long",day:"numeric",month:"long"})}</div>
 <div class="srow">${ac&&ac.st.temp!=null?`<span>🌡 الغرفة ${ac.st.temp}°</span>`:""}<span>💡 ${on?on+" ضوء شغّال":"الإنارة طافية"}</span>${sunT.sunset?`<span>🌇 الغروب ${sunT.sunset}</span>`:""}</div>

async function lanCheck(){if(CUSTOMER_APP||location.protocol!=="https:")return;let j;try{j=await (await fetch("api/where",{cache:"no-store"})).json();}catch(e){return;}
 if(!j||!j.home||!j.lan||!j.lan.length)return;const url=j.lan[0];let auto=false;try{auto=localStorage.getItem("tat-lan-auto")==="1";}catch(e){}
 const go=()=>{location.href=url;};if(auto){toast("🏠 أنت بالبيت، أحولك للتابلت مباشرة (أسرع)");setTimeout(go,900);return;}
 const d=document.createElement("div");d.className="lanbar";d.innerHTML=`<span>🏠 أنت بنفس شبكة البيت. افتح التابلت مباشرة حتى تصير الاستجابة فورية.</span><button data-l="1">افتح المباشر</button><button data-l="2">دائماً</button><button data-l="0" aria-label="سد">✕</button>`;
 d.onclick=e=>{const b=e.target.closest("[data-l]");if(!b)return;if(b.dataset.l==="2"){try{localStorage.setItem("tat-lan-auto","1");}catch(_){}}if(b.dataset.l!=="0")go();d.remove();};document.body.appendChild(d);}

 else if(role.locked)setTimeout(()=>$("#instBtn").click(),400);}
})();
