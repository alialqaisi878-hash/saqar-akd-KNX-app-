name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["ets/**", "server/**", "admin/**", ".github/workflows/ets-exe.yml", ".github/workflows/admin-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AIOHTTP_NO_EXTENSIONS: "1"
      MULTIDICT_NO_EXTENSIONS: "1"
      FROZENLIST_NO_EXTENSIONS: "1"
      PROPCACHE_NO_EXTENSIONS: "1"
      YARL_NO_EXTENSIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Company signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tat.jks"
            echo "TAT_KEYSTORE=$RUNNER_TEMP/tat.jks" >> "$GITHUB_ENV"
            echo "signing with the company key"
          else
            echo "KEYSTORE_B64 secret missing: debug key (updates need uninstall)"
          fi
      - name: Version of the page/Python inside the APK
        run: echo "${{ github.run_number }}" > app/src/main/assets/webver.txt
      - name: Build
        env:
          TAT_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle --no-daemon :app:assembleDebug :control:assembleDirectDebug :control:bundlePlayRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SaqarKNX-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            control/build/outputs/apk/direct/debug/*.apk
            control/build/outputs/bundle/playRelease/*.aab
      - name: Publish APK to the apk branch
        run: |
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/KNXProg.apk
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/SaqarKNX.apk
          cp control/build/outputs/apk/direct/debug/control-direct-debug.apk /tmp/out/TATSMART.apk
          cp control/build/outputs/apk/direct/debug/control-direct-debug.apk /tmp/out/AKDKNX.apk
          cp control/build/outputs/bundle/playRelease/control-play-release.aab /tmp/out/TATSMART-store.aab
          KC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts); KN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TC=$(grep -oP 'versionCode = \K[0-9]+' control/build.gradle.kts); TN=$(grep -oP 'versionName = "\K[^"]+' control/build.gradle.kts)
          echo "{\"knxprog\":{\"code\":$KC,\"name\":\"$KN\"},\"tatsmart\":{\"code\":$TC,\"name\":\"$TN\"}}" > /tmp/out/version.json
          cat /tmp/out/version.json
          # online update bundle for KNX Prog (no reinstall): page + Python, sha256 in the manifest
          mkdir -p /tmp/out/web
          cp app/src/main/assets/index.html app/src/main/python/knx_bridge.py app/src/main/python/assistant.py \
             app/src/main/python/tuya_cloud.py app/src/main/python/solis_cloud.py \
             app/src/main/python/audio_linkplay.py /tmp/out/web/
          MIN=$(python3 -c "import json;print(json.load(open('ota.json'))['min_app'])")
          python3 - "$MIN" "${{ github.run_number }}" <<'PY'
          import hashlib, json, os, sys
          d = "/tmp/out/web"
          files = {f: hashlib.sha256(open(os.path.join(d, f), "rb").read()).hexdigest() for f in sorted(os.listdir(d))}
          json.dump({"ver": int(sys.argv[2]), "min_app": int(sys.argv[1]), "files": files}, open(os.path.join(d, "manifest.json"), "w"))
          PY
          cat /tmp/out/web/manifest.json
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.apk *.aab version.json web
          git commit -q -m "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
