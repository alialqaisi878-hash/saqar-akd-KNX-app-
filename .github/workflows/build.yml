name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["ets/**", ".github/workflows/ets-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AIOHTTP_NO_EXTENSIONS: "1"
      MULTIDICT_NO_EXTENSIONS: "1"
      FROZENLIST_NO_EXTENSIONS: "1"
      PROPCACHE_NO_EXTENSIONS: "1"
      YARL_NO_EXTENSIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SaqarKNX-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to the apk branch
        run: |
          mkdir -p /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/SaqarKNX.apk
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add SaqarKNX.apk
          git commit -q -m "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
