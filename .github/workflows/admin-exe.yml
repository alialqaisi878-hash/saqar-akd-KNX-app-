name: Build TAT Admin (Windows exe)

on:
  push:
    branches: [main]
    paths: ["admin/**", ".github/workflows/admin-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole --name TATAdmin admin/tat_admin.py
      - name: Publish exe to the admin branch
        shell: bash
        run: |
          mkdir -p /tmp/out && cp dist/TATAdmin.exe /tmp/out/
          cd /tmp/out
          git init -q -b admin
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add TATAdmin.exe
          git commit -q -m "TAT Admin from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" admin
