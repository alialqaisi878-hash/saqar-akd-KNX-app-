function f16enc(v){let m=Math.round(v*100),e=0;while(m<-2048||m>2047){m=Math.round(m/2);e++;}const neg=m<0;let mm=m&0x7ff;const raw=(neg?0x8000:0)|(e<<11)|mm;return [raw>>8,raw&255];}
function tg(ga,dpt,v){if(!ga)return;const main=String(dpt).split(".")[0];
 if(main==="1")emit({t:"tg",ga,bit:v?1:0});else if(main==="5")emit({t:"tg",ga,bytes:[Math.round(v*255/100)]});else if(main==="9")emit({t:"tg",ga,bytes:f16enc(+v)});}
function devByGa(ga){for(const d of cur().devices){const g=d.ga||{};for(const k in g)if(g[k]===ga)return [d,k];}return [null,null];}
function knxWrite(m){
 const [d,k]=devByGa(m.ga);if(!d)return;const g=d.ga;
 setTimeout(()=>{
  if(d.type==="switch"&&k==="cmd")tg(g.status,"1.001",m.value);
  if(d.type==="dimmer"){if(k==="cmd"){tg(g.status,"1.001",m.value);tg(g.valueStatus,"5.001",m.value?(d.st&&d.st.level)||100:0);}if(k==="value"){tg(g.valueStatus,"5.001",m.value);tg(g.status,"1.001",m.value>0);}}
  if(d.type==="blind"){if(k==="updown")tg(g.positionStatus,"5.001",m.value?100:0);if(k==="position")tg(g.positionStatus,"5.001",m.value);}
 },250);
}
function tuyaCmd(m){const x=TUYA.find(t=>t.id===m.id);if(!x)return;const cmds=m.commands||[{code:m.code,value:m.value}];
 cmds.forEach(c=>{x.status[c.code]=c.value;});
 if(x.status.switch!=null&&"cur_power" in x.status)x.status.cur_power=x.status.switch?11850:0;
 saveTuya();setTimeout(()=>emit({t:"tuya",devices:[x]}),300);}
function setDev(d,on,lv){const g=d.ga||{};d.st=d.st||{};
 if(d.type==="tuya"){tuyaCmd({id:d.tuyaId,commands:[{code:d.code||"switch",value:!!on}].concat(lv!=null&&d.dimCode?[{code:d.dimCode,value:Math.round((d.dimMin||10)+(lv/100)*((d.dimMax||1000)-(d.dimMin||10)))}]:[])});return;}
 if(d.type==="switch")tg(g.cmd,"1.001",on);
 if(d.type==="dimmer"){if(lv!=null&&on)tg(g.valueStatus,"5.001",lv);tg(g.status,"1.001",on);if(!on)tg(g.valueStatus,"5.001",0);}
 if(d.type==="hvac")tg(g.cmd,"1.001",on);
}
function runActions(acts){acts.forEach(a=>{const d=cur().devices.find(x=>x.id===a.id);if(!d)return;
 if(d.type==="blind"&&a.position!=null){tg(d.ga.positionStatus,"5.001",a.position);return;}
 if(d.type==="hvac"&&a.setpoint!=null)tg(d.ga.setpoint,"9.001",a.setpoint);
 setDev(d,a.on,a.level);});return acts.length;}

window.fetch=function(u,o){

  case "api/owner":{const p=DB.projects.find(x=>x.id===body.project);if(p)p.devices.forEach(d=>{const c=(body.devices||{})[d.id];if(c){if(c.name)d.name=c.name;d.fav=!!c.fav;if(Number.isInteger(c.ord))d.ord=c.ord;}});if(p&&body.home)p.home=body.home;saveDb();return json({ok:true});}
  case "api/alloff":cur().devices.forEach(d=>{if(d.type!=="scene"&&d.type!=="blind")setDev(d,false);});return json({ok:true});

 }

/* ---------- Tuya ---------- */
let tuyaSt={},tuyaList=null;
const DIM_RANGE={bright_value_v2:[10,1000],bright_value:[25,255],bright_value_1:[10,1000],bright_value_2:[10,1000],bright_value_3:[10,1000]};
function tuyaPct(d,v){const a=d.dimMin??10,b=d.dimMax??1000;return Math.max(0,Math.min(100,Math.round((v-a)*100/(b-a))));}
function tuyaRaw(d,pct){const a=d.dimMin??10,b=d.dimMax??1000;return Math.round(a+(b-a)*pct/100);}
function tuyaFeat(d){
 const st=(tuyaSt[d.tuyaId]||{}).status||{};
 const f={st};
 f.temp=["temp_value_v2","temp_value"].find(k=>typeof st[k]==="number");f.tempMax=f.temp==="temp_value"?255:1000;
 f.colour=["colour_data_v2","colour_data"].find(k=>k in st);f.cMax=f.colour==="colour_data"?255:1000;
 f.mode="work_mode" in st;
 if(typeof st.cur_power==="number"){f.power=st.cur_power/10;f.volt=typeof st.cur_voltage==="number"?st.cur_voltage/10:null;f.amp=typeof st.cur_current==="number"?st.cur_current/1000:null;}
 return f;
}
function tuyaColour(f){let c=f.st[f.colour];if(typeof c==="string"){try{c=JSON.parse(c);}catch(e){c=null;}}return c&&typeof c==="object"?c:null;}
function tuyaTint(d){
 if(d.type!=="tuya"||!d.st.on)return "";const f=tuyaFeat(d);
 if(f.colour&&f.st.work_mode==="colour"){const c=tuyaColour(f);if(c)return `background:hsl(${c.h},90%,60%);border-color:hsl(${c.h},90%,50%);box-shadow:0 0 0 8px hsla(${c.h},90%,60%,.35)`;}
 if(f.temp){const k=f.st[f.temp]/f.tempMax;return `background:hsl(${36-k*(36-210)},${90-k*40}%,${62+k*18}%)`;}
 return "";
}
function tuyaApply(){
 db.projects.forEach(p=>p.devices.forEach(d=>{
  if(d.type!=="tuya"||!d.tuyaId)return;const t=tuyaSt[d.tuyaId];if(!t)return;
  d.st.offline=!t.online;if(d.code&&d.code in t.status)d.st.on=!!t.status[d.code];
  if(d.dimCode&&typeof t.status[d.dimCode]==="number")d.st.level=tuyaPct(d,t.status[d.dimCode]);
 }));
}
function tuyaSend(d,code,value){
 if(!d.tuyaId){toast("هذا الجهاز ما مربوط بجهاز تويا، اربطه من وضع التعديل");return false;}
 if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:"tuya",id:d.tuyaId,code,value}));
 const t=new Date().toLocaleTimeString("en-GB");log.unshift({t,addr:"Tuya "+(d.tuyaName||d.name),val:code+" = "+value});if(log.length>200)log.pop();
 return true;
}
async function loadTuya(force){
 if(tuyaList&&!force)return tuyaList;
 const r=await fetch("api/tuya/devices").then(r=>r.json()).catch(()=>({ok:false,error:"ما كدرت أوصل لبرنامج الربط"}));
 if(!r.ok)throw new Error(r.error||"Tuya");
 tuyaList=r.devices;r.devices.forEach(x=>tuyaSt[x.id]=x);return tuyaList;
}

let projRev="",saveBusy=false,saveAgain=false;const CLIENT=Math.random().toString(36).slice(2,10);
const techName=()=>{try{return localStorage.getItem("tat-tech")||"";}catch(e){return "";}};

/* ---------- KNX helpers ---------- */
function intToGa(n){n=+n;return ((n>>11)&31)+"/"+((n>>8)&7)+"/"+(n&255);}
function dptFrom(s){if(!s)return"";const m=String(s).split(/[ ,]/)[0].match(/DPS?T-(\d+)(?:-(\d+))?/i);if(!m)return"";return m[2]?m[1]+"."+String(m[2]).padStart(3,"0"):m[1]+".x";}
function hex(b){return "$"+b.toString(16).toUpperCase().padStart(2,"0");}
function encode(dpt,v){
 const main=String(dpt).split(".")[0];
 if(main==="1")return hex(v?1:0);
 if(main==="5"){const b=Math.round(v*255/100);return hex(b)+" ("+v+"%)";}
 if(main==="9")return "2-byte float "+Number(v).toFixed(1)+" °C";
 if(main==="17"||main==="18")return hex(v-1)+" (سين "+v+")";
 return String(v);
}
function telegram(addr,dpt,v,label,rx){

 if(!rx&&live()){ws.send(JSON.stringify({t:"write",ga:addr,dpt:dpt,value:String(dpt).startsWith("1.")?(v?1:0):Number(v)}));}
 const t=new Date().toLocaleTimeString("en-GB");

}

let WEBVER=null; /* page reloads itself after an online update of KNX Prog */
function connect(){
 ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+location.pathname.replace(/[^/]*$/,"")+"ws");
 ws.onmessage=e=>{
  const m=JSON.parse(e.data);
  if(m.t==="status"){const was=knxState;knxState=m.state;setTag();if(m.state==="connected"&&m.detail==="routing"){const t=$("#connTag");t.textContent="متصل (Routing، غير مؤكد)";t.className="tag";}if(m.state==="error"&&m.detail)toast(m.detail);if(m.state==="connected"&&was!=="connected")ws.send(JSON.stringify({t:"read",gas:statusGas()}));}
  if(m.t==="tg")incoming(m);
  if(m.t==="tuya"){m.devices.forEach(x=>tuyaSt[x.id]=x);tuyaApply();renderStage();if(tab==="dev")renderPane();}
  if(m.t==="project"&&!(m.by&&m.by===CLIENT))reloadProject();
  if(m.t==="schedules"){schedules=null;if(tab==="sch")renderPane();if(dashOn&&dpage==="scenes")renderDash();}
  if(m.t==="solar"){solarLive={configured:true,state:m.state,data:m.data};if(dashOn&&dpage==="solar")renderDash();}
  if(m.t==="cameras"){camList=null;if(dashOn&&dpage==="cams")renderDash();}
  if(m.t==="audio"){audioZones=m.zones||[];if(dashOn&&dpage==="audio")renderDash();}
  if(m.t==="status"&&dashOn){if(dpage==="maint"&&role.installer)loadBInfo();else renderDash();}
  if(m.t==="tuya_err"&&role.installer)toast("تويا: "+m.msg);
  if(m.t==="notify"){toast("🔔 "+m.title+": "+m.body);if(auto){auto.log=[{t:new Date().toLocaleString("en-GB").slice(0,17),title:m.title,body:m.body}].concat(auto.log||[]);if(dashOn&&dpage==="auto")renderDash();}}
  if(m.t==="error")toast(m.msg);
  if(m.t==="remote"&&location.protocol!=="https:"){const t=$("#connTag");if(t){let a=document.getElementById("remoteLink");if(!a){a=document.createElement("a");a.id="remoteLink";a.className="tag";a.target="_blank";a.style.marginInlineStart="6px";t.after(a);}a.href=m.url;a.textContent="🌐 رابط من برة البيت";a.title=m.url;}}
 };
 ws.onopen=()=>{fetch("api/bridge").then(r=>r.json()).then(b=>{if(b.web_ver==null)return;if(WEBVER==null)WEBVER=b.web_ver;else if(b.web_ver!==WEBVER)location.reload();}).catch(()=>{});};
 ws.onclose=()=>{knxState="offline";setTag();setTimeout(connect,3000);};
}
function f16(b){const raw=(b[0]<<8)|b[1];let m=raw&0x7ff;if(raw&0x8000)m=m-2048;const e=(raw>>11)&0xf;return Math.round(m*Math.pow(2,e))/100;}
function incoming(m){
 mntNote(m);
 const val=(dpt)=>{const main=String(dpt).split(".")[0];
  if(main==="1")return m.bit!=null?!!m.bit:(m.bytes?!!m.bytes[0]:false);
  if(!m.bytes)return null;
  if(main==="5")return Math.round(m.bytes[0]*100/255);
  if(main==="9"&&m.bytes.length>=2)return f16(m.bytes);
  return null;};
 let shown="",changed=false;
 db.projects.forEach(p=>p.devices.forEach(d=>{
  const g=d.ga||{};
  TYPES[d.type].fields.forEach(([k,,dpt])=>{
   if(g[k]!==m.ga)return;const v=val(dpt);if(v==null)return;shown=shown||encode(dpt,dpt.startsWith("1.")?(v?1:0):v);changed=true;
   if(d.type==="switch"&&(k==="status"||k==="cmd"))d.st.on=v;
   if(d.type==="dimmer"){if(k==="status"||k==="cmd")d.st.on=v;if(k==="valueStatus"||k==="value"){d.st.level=v;d.st.on=v>0;}}
   if(d.type==="blind"){if(k==="positionStatus"||k==="position")d.st.pos=v;if(k==="updown")d.st.pos=v?100:0;}
   if(d.type==="hvac"){if(k==="cmd")d.st.on=v;if(k==="setpoint")d.st.setpoint=v;if(k==="temp")d.st.temp=v;}
  });
 }));
 const t=new Date().toLocaleTimeString("en-GB");
 log.unshift({t,addr:m.ga,val:shown||(m.bit!=null?hex(m.bit):(m.bytes||[]).map(hex).join(" ")),rx:true});
 if(log.length>200)log.pop();
 if(changed){renderStage();}
 if(tab!=="ga")renderPane();
}

/* ---------- schedules (run by the bridge, also when no page is open) ---------- */
let schedules=null,holiday={enabled:false,devices:[]},sunT={};
const DAYS=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
const schedulable=d=>["switch","dimmer","tuya","hvac","blind","scene"].includes(d.type);
async function loadSchedules(){try{const r=await fetch("api/schedules");const j=r.ok?await r.json():{};schedules=j.schedules||[];holiday=Object.assign({enabled:false,devices:[]},j.holiday||{});sunT=j.sun||{};}catch(e){schedules=[];}}
function whenText(s){const off=+s.offset||0,o=off?(off>0?" + ":" − ")+Math.abs(off)+" د":"";
 if(s.at==="sunset")return "🌇 الغروب"+o+(sunT.sunset?` (${sunT.sunset})`:"");if(s.at==="sunrise")return "🌅 الشروق"+o+(sunT.sunrise?` (${sunT.sunrise})`:"");return s.time;}
function saveSchedules(){fetch("api/schedules",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({schedules,holiday})}).then(r=>{if(!r.ok)throw 0;}).catch(()=>toast("ما انحفظت المواعيد، تأكد إن الجسر شغّال"));}
function actLabel(s){const ds=(s.devices||[]).map(id=>P().devices.find(x=>x.id===id)).filter(Boolean);
 const allScene=ds.length&&ds.every(x=>x.type==="scene");return allScene?"تشغيل":s.on?"تشغيل":"إطفاء";}
function renderSchedules(pane){
 if(schedules===null){pane.innerHTML=`<p class="muted">جاري التحميل…</p>`;loadSchedules().then(()=>{if(tab==="sch")renderPane();});return;}
 const p=P();
 pane.innerHTML=`<p class="muted">المواعيد تشتغل من التابليت بالبيت، حتى لو كل التلفونات مسدودة.</p>`+
  (schedules.length?schedules.map((s,i)=>{const names=(s.devices||[]).map(id=>(p.devices.find(x=>x.id===id)||{}).name).filter(Boolean);
   const days=(s.days&&s.days.length&&s.days.length<7)?s.days.map(x=>DAYS[x]).join("، "):"كل يوم";
   return `<div class="sch"><span class="tm" style="${s.at&&s.at!=="time"?"font-size:.9rem":""}">${esc(whenText(s))}</span><span class="tx"><b style="color:var(--ink)">${esc(s.name||actLabel(s))}</b><br>${esc(schedWhat(s))}${s.end?" · يطفي "+esc(s.end):""}<br>${days}</span>
   <label title="مفعّل"><input type="checkbox" data-en="${i}" ${s.enabled!==false?"checked":""}></label><button class="btn" data-ed="${i}">تعديل</button></div>`;}).join(""):`<p class="muted">ما بيه مواعيد بعد.</p>`)+
  `<button class="btn primary" id="addSch">+ موعد جديد</button>`+
  `<div class="sch" style="margin-top:14px;flex-wrap:wrap"><span class="tx"><b style="color:var(--ink)">✈️ وضع السفر</b><br>لمن تكونون برة البيت، الإنارة المختارة تشتغل وتنطفي بشكل عشوائي من الغروب لحد نص الليل، كأنه أكو ناس بالبيت.</span>
   <label><input type="checkbox" id="holEn" ${holiday.enabled?"checked":""}> مفعّل</label><button class="btn" id="holEd">اختيار الإنارة (${holiday.devices.length})</button></div>`;
 pane.querySelectorAll("[data-en]").forEach(c=>c.onchange=()=>{schedules[+c.dataset.en].enabled=c.checked;saveSchedules();});
 pane.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>editSchedule(+b.dataset.ed));
 $("#addSch").onclick=()=>editSchedule(-1);
 $("#holEn").onchange=()=>{if($("#holEn").checked&&!holiday.devices.length){$("#holEn").checked=false;toast("اختار الإنارة أول");return;}holiday.enabled=$("#holEn").checked;saveSchedules();toast(holiday.enabled?"وضع السفر شغّال":"انطفى وضع السفر");};
 $("#holEd").onclick=holidayPick;
}
function holidayPick(){const devs=P().devices.filter(d=>["switch","dimmer","tuya"].includes(d.type));
 sheet(`<header><h2>إنارة وضع السفر</h2><button class="x" data-close aria-label="إغلاق">✕</button></header>
  <div class="devpick" style="max-height:50vh">${devs.map(d=>`<label><input type="checkbox" data-hv="${d.id}" ${holiday.devices.includes(d.id)?"checked":""}><span class="dvn">${esc(d.name)}<small>${esc(d.room||"")}</small></span></label>`).join("")||"<span class='muted'>ما بيه إنارة</span>"}</div>
  <div class="actions"><span></span><button class="btn primary" id="holOk">حفظ</button></div>`,()=>{
  $("#holOk").onclick=()=>{holiday.devices=[...document.querySelectorAll("[data-hv]:checked")].map(c=>c.dataset.hv);if(!holiday.devices.length)holiday.enabled=false;saveSchedules();close();schedRefresh();};});
}

function editSchedule(i){
 const p=P(),scenes=p.scenes||[];
 const s=i>=0?JSON.parse(JSON.stringify(schedules[i])):{id:uid(),name:"",time:"19:00",on:true,days:[0,1,2,3,4,5,6],devices:[],enabled:true,scene_id:scenes.length?scenes[0].id:""};
 const devs=p.devices.filter(d=>schedulable(d)&&d.type!=="scene");
 const what=s.scene_id?"sc:"+s.scene_id:"dev";
 sheet(`<header><h2>${i>=0?"تعديل الموعد":"موعد جديد"}</h2><button class="x" data-close aria-label="إغلاق">✕</button></header>
  <div class="field"><label for="sName">الاسم (اختياري)</label><input id="sName" value="${esc(s.name||"")}" placeholder="مثلاً: صباح الخير"></div>

function operate(d){
 const g=d.ga||{};
 if(d.type==="switch"){
  const v=!d.st.on;if(!telegram(g.cmd,"1.001",v?1:0))return;d.st.on=v;respond(g.status,"1.001",v?1:0);refresh();return;
 }
 if(d.type==="scene"){if(!telegram(g.scene,"17.001",d.sceneNo||1))return;toast("انرسل "+d.name);return;}
 if(d.type==="tuya"){
  if(d.st.offline)toast(d.name+": الجهاز غير متصل بتويا");
  const f=tuyaFeat(d);
  if(!d.dimCode&&!f.temp&&!f.colour&&f.power==null){const v=!d.st.on;if(!tuyaSend(d,d.code,v))return;d.st.on=v;refresh();return;}
  const multi=(cmds)=>{if(!d.tuyaId){toast("هذا الجهاز ما مربوط بجهاز تويا");return false;}
   if(!d.st.on){cmds.unshift({code:d.code,value:true});d.st.on=true;}
   if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:"tuya",id:d.tuyaId,commands:cmds}));
   const st=(tuyaSt[d.tuyaId]||{}).status;if(st)cmds.forEach(c=>st[c.code]=c.value);
   log.unshift({t:new Date().toLocaleTimeString("en-GB"),addr:"Tuya "+(d.tuyaName||d.name),val:cmds.map(c=>c.code+"="+JSON.stringify(c.value)).join(" ")});refresh();return true;};
  const ct=f.temp?Math.round(f.st[f.temp]*100/f.tempMax):50;
  const hues=[[0,"أحمر"],[28,"برتقالي"],[52,"أصفر"],[120,"أخضر"],[180,"سمائي"],[230,"أزرق"],[275,"بنفسجي"],[320,"وردي"]];
  sheet(`<header><h2>${esc(d.name)}</h2><button class="x" data-close aria-label="إغلاق">✕</button></header>
   <div class="big"><button id="on" class="${d.st.on?"active":""}">تشغيل</button><button id="off" class="${!d.st.on?"active":""}">إطفاء</button></div>
   ${f.power!=null?`<div class="meter"><div><b>${f.power.toFixed(1)}</b>واط</div><div><b>${f.volt!=null?f.volt.toFixed(0):"–"}</b>فولت</div><div><b>${f.amp!=null?f.amp.toFixed(2):"–"}</b>أمبير</div></div>`:""}
   ${d.dimCode?`<div class="slider"><div class="v" id="v">${d.st.level||0}%</div><input type="range" id="r" min="1" max="100" step="1" value="${d.st.level||0}" aria-label="الإضاءة"></div>`:""}
   ${f.temp?`<div class="slider" dir="ltr"><div class="muted" style="display:flex;justify-content:space-between"><span>دافي</span><span>لون الإضاءة</span><span>بارد</span></div><div class="ct"></div><input type="range" id="ct" min="0" max="100" step="1" value="${ct}" aria-label="لون الإضاءة"></div>`:""}
   ${f.colour?`<div class="swatches">${f.temp||f.mode?`<button class="white" id="white">أبيض</button>`:""}${hues.map(([h,n])=>`<button data-h="${h}" title="${n}" aria-label="${n}" style="background:hsl(${h},90%,55%)"></button>`).join("")}</div>`:""}`,()=>{
   $("#on").onclick=()=>{if(!tuyaSend(d,d.code,true))return;d.st.on=true;refresh();close();operate(d);};
   $("#off").onclick=()=>{if(!tuyaSend(d,d.code,false))return;d.st.on=false;refresh();close();operate(d);};
   const r=$("#r"),v=$("#v");
   if(r){r.oninput=()=>v.textContent=r.value+"%";
    r.onchange=()=>{const n=+r.value;d.st.level=n;const cur=tuyaFeat(d);
     if(cur.colour&&cur.st.work_mode==="colour"){const c=tuyaColour(cur)||{h:0,s:cur.cMax};multi([{code:cur.colour,value:{h:c.h,s:c.s,v:Math.max(10,Math.round(cur.cMax*n/100))}}]);}
     else multi([{code:d.dimCode,value:tuyaRaw(d,n)}]);};}
   const c=$("#ct");if(c)c.onchange=()=>{const cmds=[];if(f.mode)cmds.push({code:"work_mode",value:"white"});cmds.push({code:f.temp,value:Math.round(+c.value*f.tempMax/100)});multi(cmds);};
   const w=$("#white");if(w)w.onclick=()=>multi([{code:"work_mode",value:"white"}]);
   document.querySelectorAll(".swatches [data-h]").forEach(b=>b.onclick=()=>{const cmds=[];if(f.mode)cmds.push({code:"work_mode",value:"colour"});
    cmds.push({code:f.colour,value:{h:+b.dataset.h,s:f.cMax,v:Math.max(10,Math.round(f.cMax*(d.st.level||100)/100))}});multi(cmds);});
  });
  return;
 }
 const body=()=>{

 sheet(`<header><h2>${esc(d.name)}</h2><button class="x" data-close aria-label="إغلاق">✕</button></header>${body()}`,s=>{

  if(d.type==="dimmer"){r.oninput=()=>v.textContent=r.value+"%";r.onchange=()=>{const n=+r.value;if(!telegram(g.value,"5.001",n))return;d.st.level=n;d.st.on=n>0;respond(g.valueStatus,"5.001",n);refresh();};}
  if(d.type==="blind"){
   r.oninput=()=>v.textContent=r.value+"%";
   r.onchange=()=>{const n=+r.value;if(!telegram(g.position,"5.001",n))return;d.st.pos=n;respond(g.positionStatus,"5.001",n);refresh();};
   $("#up").onclick=()=>{if(!telegram(g.updown,"1.008",0))return;d.st.pos=0;respond(g.positionStatus,"5.001",0);refresh();r.value=0;v.textContent="0%";};
   $("#down").onclick=()=>{if(!telegram(g.updown,"1.008",1))return;d.st.pos=100;respond(g.positionStatus,"5.001",100);refresh();r.value=100;v.textContent="100%";};
   $("#stop").onclick=()=>{telegram(g.stop,"1.017",1);};
  }
  if(d.type==="hvac"){r.oninput=()=>v.textContent=r.value+"°";r.onchange=()=>{const n=+r.value;if(!telegram(g.setpoint,"9.001",n))return;d.st.setpoint=n;refresh();};}
 });
}

$("#planFile").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;e.target.value="";
 try{

   const page=await pdf.getPage(1);const vp0=page.getViewport({scale:1});
   const scale=Math.min(4,2000/Math.max(vp0.width,vp0.height));const vp=page.getViewport({scale});
   canvas=document.createElement("canvas");canvas.width=vp.width;canvas.height=vp.height;
   const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
   await page.render({canvasContext:ctx,viewport:vp}).promise;
  }else{
   const url=URL.createObjectURL(f);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
   const k=Math.min(1,2000/Math.max(img.naturalWidth,img.naturalHeight));
   canvas=document.createElement("canvas");canvas.width=Math.round(img.naturalWidth*k);canvas.height=Math.round(img.naturalHeight*k);
   const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);
  }
  const p=P();p.plan=canvas.toDataURL("image/jpeg",0.85);p.planW=canvas.width;p.planH=canvas.height;p.sample=false;
  save();render();toast("انرفعت الخريطة");
 }catch(err){toast("ما كدرت أفتح الملف. تأكد إنه صورة أو PDF سليم.");}
};

/* ---------- ETS import ---------- */
async function importEts(file){
 const msg=$("#etsMsg");msg.textContent="جاري القراءة…";
 let gas=[],encrypted=false;
 try{
  if(/\.(csv|txt)$/i.test(file.name)){gas=parseCsv(await file.text());}
  else if(/\.xml$/i.test(file.name)){const doc=new DOMParser().parseFromString(await file.text(),"application/xml");
   for(const el of doc.getElementsByTagName("GroupAddress")){let a=el.getAttribute("Address");if(a==null)continue;a=/\//.test(a)?a:intToGa(a);
    gas.push({addr:a,name:el.getAttribute("Name")||"",dpt:dptFrom(el.getAttribute("DatapointType")||el.getAttribute("DPTs"))});}}
  else{
   if(!window.JSZip)throw new Error("zip");
   const scan=async zip=>{
    for(const name of Object.keys(zip.files)){
     const f=zip.files[name];if(f.dir)continue;
     if(/\.zip$/i.test(name)){try{const inner=await JSZip.loadAsync(await f.async("arraybuffer"));await scan(inner);}catch(e){encrypted=true;}}
     else if(/(^|\/)\d+\.xml$/i.test(name)&&/P-/i.test(name)){
      let txt;try{txt=await f.async("string");}catch(e){encrypted=true;continue;}
      const doc=new DOMParser().parseFromString(txt,"application/xml");
      for(const el of doc.getElementsByTagName("GroupAddress")){
       let a=el.getAttribute("Address");if(a==null)continue;a=/\//.test(a)?a:intToGa(a);
       gas.push({addr:a,name:el.getAttribute("Name")||"",dpt:dptFrom(el.getAttribute("DatapointType"))});
      }
     }
    }
   };
   await scan(await JSZip.loadAsync(file));
  }
 }catch(e){msg.innerHTML=`<span style="color:var(--danger)">ما كدرت أقرأ الملف.</span>`;return;}
 if(!gas.length){
  msg.innerHTML=`<span style="color:var(--danger)">${encrypted?"ملف المشروع محمي بباسورد. من ETS افتح Group Addresses ← Export وصدّرها CSV وارفعها هنا.":"ما لكيت عناوين بالملف."}</span>`;return;
 }
 const seen=new Map();gas.forEach(g=>seen.set(g.addr,g));
 const p=P();const before=p.gas.length;
 if(p.sample){p.gas=[];}
 p.gas.forEach(g=>{if(!seen.has(g.addr))seen.set(g.addr,g);});
 p.gas=[...seen.values()].sort((a,b)=>{const x=a.addr.split("/").map(Number),y=b.addr.split("/").map(Number);return x[0]-y[0]||x[1]-y[1]||x[2]-y[2];});
 save();renderPane();
 $("#etsMsg").innerHTML=`<span style="color:var(--cool)">انضافت ${gas.length} عنوان من ${esc(file.name)}</span>`;
}
function parseCsv(t){
 const lines=t.replace(/^﻿/,"").split(/\r?\n/).filter(Boolean);if(!lines.length)return[];
 const d=[";","\t",","].sort((a,b)=>lines[0].split(b).length-lines[0].split(a).length)[0];
 const out=[];
 for(const ln of lines){
  const cells=ln.split(d).map(c=>c.trim().replace(/^"|"$/g,"").replace(/""/g,'"'));
  const ai=cells.findIndex(c=>/^\d+\/\d+\/\d+$/.test(c));if(ai<0)continue;
  const name=cells.slice(0,ai).reverse().find(c=>c&&c!=="-")||cells.slice(ai+1).find(c=>c&&!/^DPS?T/i.test(c)&&!/^\d/.test(c))||"";
  const dc=cells.find(c=>/^DPS?T-/i.test(c));
  out.push({addr:cells[ai],name,dpt:dptFrom(dc)});
 }
 return out;
}

// TAT SMART (the customer app, or the iPhone home-screen icon) never shows anything for the technician

 ["#mEdit","#newProj","#planTools","#tGa"].forEach(q=>{const el=$(q);if(el)el.hidden=!inst;});

}

let idleT=Date.now();
["pointerdown","keydown","wheel"].forEach(ev=>document.addEventListener(ev,()=>{idleT=Date.now();},true));
function saverHtml(){const now=new Date(),p=P();const ac=p.devices.find(d=>d.type==="hvac");const on=p.devices.filter(d=>isLight(d)&&d.st.on).length;
 return `<div><div class="clk">${now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</div><div class="dt">${now.toLocaleDateString("ar-IQ",{weekday:"long",day:"numeric",month:"long"})}</div>
 <div class="srow">${ac&&ac.st.temp!=null?`<span>🌡 الغرفة ${ac.st.temp}°</span>`:""}<span>💡 ${on?on+" ضوء شغّال":"الإنارة طافية"}</span>${sunT.sunset?`<span>🌇 الغروب ${sunT.sunset}</span>`:""}</div>
 <div class="sc">${(p.scenes||[]).slice(0,4).map(s=>`<button class="dsc" data-svs="${s.id}">${DI[s.icon]||DI.star}${esc(s.name)}</button>`).join("")}</div>
 <div class="dt" style="font-size:.85rem;margin-top:26px;opacity:.6">المس الشاشة للرجوع</div></div>`;}

 if(idle){if(el.hidden){el.hidden=false;}el.innerHTML=saverHtml();const h=new Date().getHours();el.classList.toggle("night",h>=23||h<6);}

(function(){if(!CUSTOMER_APP||!hasPush())return;let off="";try{off=localStorage.getItem("tat_push_off")||"";}catch(e){}
 fetch("api/auto").then(r=>r.ok?r.json():null).then(a=>{const n=a&&a.notify;if(!n||!n.topic)return;if(n.on&&!off&&TATApp.pushState()==="off")TATApp.push(n.topic,true);else if(!n.on&&TATApp.pushState()!=="off")TATApp.push(n.topic,false);}).catch(()=>{});})();

.then(()=>fetchProject()).then(s=>{if(s&&s.projects&&s.projects.length){db=s;}else if(role.installer){save();}}).catch(()=>{}).finally(()=>{applyRole();render();setTag();connect();loadSchedules().then(()=>renderDash());openEditLink();});

async function lanCheck(){if(CUSTOMER_APP||location.protocol!=="https:")return;let j;try{j=await (await fetch("api/where",{cache:"no-store"})).json();}catch(e){return;}
 if(!j||!j.home||!j.lan||!j.lan.length)return;const url=j.lan[0];let auto=false;try{auto=localStorage.getItem("tat-lan-auto")==="1";}catch(e){}
 const go=()=>{location.href=url;};if(auto){toast("🏠 أنت بالبيت، أحولك للتابلت مباشرة (أسرع)");setTimeout(go,900);return;}
 const d=document.createElement("div");d.className="lanbar";d.innerHTML=`<span>🏠 أنت بنفس شبكة البيت. افتح التابلت مباشرة حتى تصير الاستجابة فورية.</span><button data-l="1">افتح المباشر</button><button data-l="2">دائماً</button><button data-l="0" aria-label="سد">✕</button>`;
